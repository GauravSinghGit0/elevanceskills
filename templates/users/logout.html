{% extends "users/basic.html" %}

{% block title %}Signed Out — Cineva{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-20 text-center">
    <div class="p-8 rounded-3xl bg-surface-container-low border border-outline-variant/20 shadow-2xl cinematic-glow flex flex-col items-center">
        <div class="w-16 h-16 rounded-2xl bg-surface-container flex items-center justify-center text-primary mb-4 border border-outline-variant/30">
            <span class="material-symbols-outlined text-3xl">logout</span>
        </div>
        <h1 class="text-headline-sm font-headline-sm font-bold text-on-surface">You have been logged out</h1>
        <p class="text-body-sm font-body-sm text-on-surface-variant mt-2 mb-6">
            Your Cineva session has been safely closed. Thank you for visiting.
        </p>
        <a
            href="{% url 'login' %}"
            class="w-full py-3 px-6 rounded-xl bg-primary-container text-on-primary-container hover:bg-primary font-label-lg text-label-lg font-bold shadow-lg shadow-primary-container/20 transition-all flex items-center justify-center gap-2">
            <span>Sign In Again</span>
            <span class="material-symbols-outlined text-lg">arrow_forward</span>
        </a>
    </div>
</div>
{% endblock %}
